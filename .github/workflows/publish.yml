# Publishes the graph-execution package to npm after the qa checks pass.
#   main        -> every push (a merge from development) is a release: dist-tag "latest", a git tag
#                  v<version> and a GitHub release with generated notes. The version is the next patch
#                  after npm's latest, or package.json's version when it is higher (bump it by hand on
#                  development for a minor or major release). See .github/scripts/next-version.mjs.
#                  The bumped version is not committed back: npm and the tags are the record.
#   development -> a prerelease <next>-dev.<run>.<sha>, dist-tag "dev" (npm i graph-execution@dev).
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret. Configure it once on npmjs.com:
# package graph-execution -> Settings -> Trusted publisher -> GitHub Actions,
# owner romm0109, repository graph-execution, workflow publish.yml.
name: publish
on:
  push:
    branches: [main, development]
  workflow_dispatch:
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  qa:
    uses: ./.github/workflows/qa.yml

  publish:
    needs: qa
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the v<version> tag and create the GitHub release on main
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tags, to detect a re-run and to generate release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci

      - name: Choose version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            # A re-run of a workflow that already released this commit must not release it again.
            released=$(git tag --points-at HEAD --list 'v*' | head -1)
            if [ -n "$released" ]; then
              echo "This commit was already released as $released. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$(node .github/scripts/next-version.mjs main)
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            version=$(node .github/scripts/next-version.mjs dev)
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version -w graph-execution
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip == 'false'
        run: npm run build

      # qa already ran typecheck, lint and tests, and the build is done: skip prepublishOnly.
      - if: steps.version.outputs.skip == 'false'
        run: npm publish -w graph-execution --tag ${{ steps.version.outputs.tag }} --provenance --access public --ignore-scripts

      - if: steps.version.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag

      - if: steps.version.outputs.skip == 'false'
        run: echo "Published graph-execution@${{ steps.version.outputs.version }} with dist-tag ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

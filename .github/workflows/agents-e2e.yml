# Opens graph-manager's OpenCode terminal with the real OpenCode CLI and checks that it connects graph-manager's MCP
# server (apps/graph-manager/scripts/agents-e2e.mjs). The unit tests use fake CLIs, which cannot tell.
name: agents-e2e
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  opencode:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm install -g @opencode/cli
      - run: node apps/graph-manager/scripts/agents-e2e.mjs

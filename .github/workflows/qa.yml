name: qa
on:
  pull_request:
  workflow_dispatch:
  # publish.yml calls this workflow on pushes to main and development, so it does not run twice there.
  workflow_call:
  push:
    branches-ignore: [main, development]
permissions:
  contents: read
jobs:
  qa:
    strategy:
      # Every OS reports its own result: a failure on one does not cancel the others.
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: git config --global user.email ci@ci && git config --global user.name ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

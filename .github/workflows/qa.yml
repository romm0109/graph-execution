name: qa
on: [push, pull_request, workflow_dispatch]
jobs:
  qa:
    strategy:
      # Every OS reports its own result: a failure on one does not cancel the others.
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: git config --global user.email ci@ci && git config --global user.name ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  # The contract tests on Postgres. A separate job because service containers only run on Linux runners: a services
  # block on the matrix job would fail on macOS and Windows, which run the SQLite side of the suite only.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w graph-execution
      - run: npm test -w graph-manager -- src/server/db

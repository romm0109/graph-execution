name: Feature request
description: Suggest an enhancement to the CLI or graph-manager
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Please search existing issues to see if it is already proposed.
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      options:
        - graph-execution CLI (packages/graph-execution)
        - graph-manager (apps/graph-manager)
        - Docs
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change? Include acceptance criteria if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you thought about.

<!doctype html>
<html><head><meta charset="utf-8"><title>graph-execution trailer</title>
<style>html,body{margin:0;background:#05070f;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, DUR = 53;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = {
  bg: '#05070f', cyan: '#4fd1ff', mag: '#b46cff', green: '#3ee6a0', amber: '#ffb547', red: '#ff5d73',
  text: '#e6e9f5', muted: '#8f99bb', dim: '#4a5578', panel: 'rgba(10,14,30,0.86)',
};
const SANS = 'Inter, "Inter Display", system-ui, sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const r = rng(n * 9973 + 17); return r(); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `500 28px ${SANS}`;
  ctx.fillStyle = o.color || C.text;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.glow) { ctx.shadowColor = o.glowColor || o.color || C.cyan; ctx.shadowBlur = o.glow; }
  ctx.fillText(s, x, y);
  if (o.glow && o.double) ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, font, ls) { ctx.save(); ctx.font = font; if (ls) ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
const GLYPHS = '01<>/#*+=-_{}[]ABCDEFGHJKLMNPQRSTUVWXYZ$%&';
function decode(str, k, seed) { // k: 0..1 revealed
  const n = str.length, shown = Math.floor(k * n * 1.0001);
  let out = '';
  for (let i = 0; i < n; i++) {
    if (i < shown || str[i] === ' ') out += str[i];
    else if (i < shown + 6) out += GLYPHS[Math.floor(hash(seed + i * 31) * GLYPHS.length)];
    else out += ' ';
  }
  return out;
}
const typed = (s, lt, start, cps) => s.slice(0, Math.max(0, Math.floor((lt - start) * cps)));

// ---------- background ----------
const R0 = rng(42);
const stars = Array.from({ length: 280 }, () => ({ x: R0() * W, y: R0() * H * 0.66, s: R0() * 1.7 + .3, p: R0() * 6.28, sp: R0() * .6 + .15 }));
const motes = Array.from({ length: 60 }, () => ({ x: R0() * W, y: R0() * H, v: R0() * 30 + 10, s: R0() * 2 + .5, p: R0() }));
function drawBg(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(W / 2, -260, 0, W / 2, -260, 1400);
  g.addColorStop(0, 'rgba(79,209,255,0.20)'); g.addColorStop(1, 'rgba(79,209,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const hy = H * 0.66;
  g = ctx.createRadialGradient(W / 2, hy, 0, W / 2, hy, 1100);
  g.addColorStop(0, 'rgba(180,108,255,0.22)'); g.addColorStop(.5, 'rgba(120,60,220,0.07)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // stars
  for (const s of stars) {
    const a = .35 + .65 * (.5 + .5 * Math.sin(t * s.sp * 3 + s.p));
    const x = (s.x - t * 6 * s.s + W * 10) % W;
    ctx.fillStyle = `rgba(200,225,255,${a * .7})`;
    ctx.fillRect(x, s.y, s.s, s.s);
  }
  // floor grid
  ctx.save();
  ctx.beginPath(); ctx.rect(0, hy, W, H - hy); ctx.clip();
  const fg = ctx.createLinearGradient(0, hy, 0, H);
  fg.addColorStop(0, 'rgba(10,6,30,0.0)'); fg.addColorStop(1, 'rgba(20,10,50,0.55)');
  ctx.fillStyle = fg; ctx.fillRect(0, hy, W, H - hy);
  ctx.lineWidth = 1.2;
  for (let i = -40; i <= 40; i++) {
    const xh = W / 2 + i * 26, xb = W / 2 + i * 300;
    const lg = ctx.createLinearGradient(0, hy, 0, H);
    lg.addColorStop(0, 'rgba(79,209,255,0)'); lg.addColorStop(1, 'rgba(79,209,255,0.38)');
    ctx.strokeStyle = lg; ctx.beginPath(); ctx.moveTo(xh, hy); ctx.lineTo(xb, H + 40); ctx.stroke();
  }
  const sp = (t * 1.1) % 1;
  for (let k = 0; k < 30; k++) {
    const d = (k + 1 - sp) * 0.55;
    const y = hy + 300 / d;
    if (y > H + 4) continue;
    const a = clamp(1 / d) * .55;
    ctx.strokeStyle = `rgba(180,108,255,${a})`;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // horizon line
  const hl = ctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, 'rgba(79,209,255,0)'); hl.addColorStop(.5, 'rgba(79,209,255,0.9)'); hl.addColorStop(1, 'rgba(79,209,255,0)');
  ctx.save(); ctx.shadowColor = C.cyan; ctx.shadowBlur = 24; ctx.fillStyle = hl; ctx.fillRect(0, hy - 1, W, 2); ctx.restore();
  // motes
  for (const m of motes) {
    const y = (m.y - t * m.v + H * 10) % H;
    ctx.fillStyle = `rgba(79,209,255,${.15 + .25 * Math.sin(t * 2 + m.p * 6)})`;
    ctx.beginPath(); ctx.arc(m.x, y, m.s, 0, 6.28); ctx.fill();
  }
}

// ---------- primitives ----------
function logo(cx, cy, s, a = 1, t = 0, draw = 1) {
  // s = size of rounded square
  ctx.save(); ctx.globalAlpha *= a;
  const u = s / 22, x0 = cx - 11 * u, y0 = cy - 11 * u;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = s * .25;
  rr(x0 + u, y0 + u, 20 * u, 20 * u, 5 * u);
  ctx.strokeStyle = C.cyan; ctx.lineWidth = Math.max(1.5, u * .9);
  ctx.stroke();
  ctx.fillStyle = 'rgba(79,209,255,0.08)'; ctx.fill();
  const P = [[7, 7.5], [15, 7.5], [11, 15]];
  ctx.lineWidth = Math.max(1.5, u * 1.4); ctx.lineCap = 'round';
  const e = clamp(draw * 2 - 1);
  ctx.beginPath();
  ctx.moveTo(x0 + 7 * u, y0 + 9.5 * u); ctx.lineTo(x0 + lerp(7, 10, e) * u, y0 + lerp(9.5, 13.3, e) * u);
  ctx.moveTo(x0 + 15 * u, y0 + 9.5 * u); ctx.lineTo(x0 + lerp(15, 12, e) * u, y0 + lerp(9.5, 13.3, e) * u);
  ctx.strokeStyle = '#ffffff'; if (e > 0) ctx.stroke();
  P.forEach(([px, py], i) => {
    const k = clamp(draw * 3 - i * .5);
    ctx.fillStyle = i === 2 ? C.mag : '#ffffff';
    ctx.shadowColor = i === 2 ? C.mag : C.cyan;
    ctx.beginPath(); ctx.arc(x0 + px * u, y0 + py * u, 2 * u * eback(k), 0, 6.28); ctx.fill();
  });
  ctx.restore();
}
function brackets(x, y, w, h, len, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
  ctx.stroke(); ctx.restore();
}
function panel(x, y, w, h, o = {}) {
  const a = o.a ?? 1;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = o.glowColor || 'rgba(79,209,255,0.35)'; ctx.shadowBlur = 50;
  rr(x, y, w, h, 18); ctx.fillStyle = C.panel; ctx.fill();
  ctx.shadowBlur = 0;
  // inner gradient sheen
  const sh = ctx.createLinearGradient(x, y, x, y + h);
  sh.addColorStop(0, 'rgba(79,209,255,0.07)'); sh.addColorStop(.3, 'rgba(79,209,255,0)');
  ctx.fillStyle = sh; ctx.fill();
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, 'rgba(79,209,255,.95)'); g.addColorStop(.45, 'rgba(79,209,255,.14)'); g.addColorStop(1, 'rgba(180,108,255,.85)');
  ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.stroke();
  // scanlines
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.018)';
  for (let yy = y; yy < y + h; yy += 4) ctx.fillRect(x, yy, w, 1);
  if (o.sweep !== undefined) { // light sweep
    const sx = x - 300 + (w + 600) * o.sweep;
    const sg = ctx.createLinearGradient(sx - 200, 0, sx + 200, 0);
    sg.addColorStop(0, 'rgba(79,209,255,0)'); sg.addColorStop(.5, 'rgba(79,209,255,0.08)'); sg.addColorStop(1, 'rgba(79,209,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(x, y, w, h);
  }
  ctx.restore();
  if (o.title) {
    ctx.fillStyle = 'rgba(79,209,255,0.06)'; ctx.fillRect(x + 1, y + 54, w - 2, 1);
    ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 28 + i * 22, y + 28, 6.5, 0, 6.28); ctx.fill(); });
    const tw = measure(o.title, `600 20px ${SANS}`) + 64;
    rr(x + 104, y + 10, tw, 36, 9); ctx.fillStyle = 'rgba(79,209,255,0.10)'; ctx.fill();
    ctx.strokeStyle = 'rgba(79,209,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    logo(x + 126, y + 28, 22, 1, 0, 1);
    text(o.title, x + 146, y + 35, { font: `600 20px ${SANS}`, color: C.text });
    if (o.right) text(o.right, x + w - 24, y + 35, { font: `500 17px ${MONO}`, color: C.muted, align: 'right' });
  }
  brackets(x - 8, y - 8, w + 16, h + 16, 22, rgba(C.cyan, .7), 1);
  ctx.restore();
}
function chip(x, y, label, color, a = 1, o = {}) {
  const font = o.font || `600 17px ${MONO}`;
  const w = measure(label, font, o.ls) + (o.dot ? 46 : 28), h = o.h || 34;
  ctx.save(); ctx.globalAlpha *= a;
  rr(x, y, w, h, h / 2); ctx.fillStyle = rgba(color, .12); ctx.fill();
  ctx.strokeStyle = rgba(color, .6); ctx.lineWidth = 1.2; ctx.stroke();
  if (o.dot) { ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(x + 20, y + h / 2, 5, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0; }
  text(label, x + (o.dot ? 34 : 14), y + h / 2 + 6, { font, color, ls: o.ls });
  ctx.restore();
  return w;
}
function check(x, y, s, color, k = 1) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 10;
  const p = [[-.32, 0], [-.08, .26], [.36, -.26]];
  ctx.beginPath(); ctx.moveTo(x + p[0][0] * s, y + p[0][1] * s);
  const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1);
  ctx.lineTo(x + lerp(p[0][0], p[1][0], k1) * s, y + lerp(p[0][1], p[1][1], k1) * s);
  if (k2 > 0) ctx.lineTo(x + lerp(p[1][0], p[2][0], k2) * s, y + lerp(p[1][1], p[2][1], k2) * s);
  ctx.stroke(); ctx.restore();
}
function spinner(x, y, r, t, color) {
  ctx.save(); ctx.strokeStyle = rgba(color, .2); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.stroke();
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.lineCap = 'round';
  const a = t * 7;
  ctx.beginPath(); ctx.arc(x, y, r, a, a + 1.9); ctx.stroke(); ctx.restore();
}
function kicker(num, label, lt, dur) {
  const a = seg(lt, 0, .5) * (1 - seg(lt, dur - .5, dur));
  if (a <= 0) return;
  const k = eo(seg(lt, 0, .9));
  ctx.save(); ctx.globalAlpha *= a;
  text(num, 140, 110, { font: `700 22px ${MONO}`, color: C.cyan, ls: 4, glow: 14 });
  ctx.fillStyle = C.cyan; ctx.fillRect(200, 102, 70 * k, 2);
  text(decode(label, seg(lt, .1, .9), Math.floor(lt * 24)), 290, 112, { font: `800 34px ${SANS}`, color: C.text, ls: 6, glow: 18, glowColor: 'rgba(79,209,255,.6)' });
  ctx.restore();
}
function caption(s, lt, dur, y = 1000) {
  const a = seg(lt, .4, 1) * (1 - seg(lt, dur - .6, dur - .1));
  if (a <= 0) return;
  text(s, W / 2, y + (1 - eo(seg(lt, .4, 1))) * 14, { font: `500 34px ${SANS}`, color: C.text, align: 'center', alpha: a, glow: 20, glowColor: 'rgba(0,0,0,.9)' });
}
function cursor(x, y, press = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1 - press * .12, 1 - press * .12);
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(8, 23); ctx.lineTo(14, 36); ctx.lineTo(19, 34); ctx.lineTo(13, 21); ctx.lineTo(23, 21); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#0a0d1a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function ripple(x, y, k, color = C.cyan) {
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.strokeStyle = rgba(color, 1 - k); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 10 + k * 70, 0, 6.28); ctx.stroke(); ctx.restore();
}
function burst(x, y, k, color, seed) {
  if (k <= 0 || k >= 1) return;
  const r = rng(seed);
  ctx.save();
  for (let i = 0; i < 22; i++) {
    const ang = r() * 6.28, sp = 40 + r() * 120;
    const d = eo(k) * sp;
    ctx.fillStyle = rgba(color, (1 - k) * .9);
    ctx.fillRect(x + Math.cos(ang) * d, y + Math.sin(ang) * d, 3, 3);
  }
  ctx.strokeStyle = rgba(color, (1 - k) * .8); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, eo(k) * 90, 0, 6.28); ctx.stroke();
  ctx.restore();
}

// ---------- scene 1: intro ----------
const introParts = (() => { const r = rng(7); return Array.from({ length: 90 }, (_, i) => ({ sx: r() * W, sy: r() * H, tgt: i % 3, d: r() * .6, c: r() > .5 ? C.cyan : C.mag })); })();
function sIntro(lt) {
  const cx = W / 2, cy = 400;
  const s = 190;
  const u = s / 22, P = [[7, 7.5], [15, 7.5], [11, 15]];
  // converging particles
  for (const p of introParts) {
    const k = eio(seg(lt, .1 + p.d, 1.5 + p.d * .6));
    if (k >= 1) continue;
    const tx = cx - 11 * u + P[p.tgt][0] * u, ty = cy - 11 * u + P[p.tgt][1] * u;
    const x = lerp(p.sx, tx, k), y = lerp(p.sy, ty, k);
    const px = lerp(p.sx, tx, Math.max(0, k - .08)), py = lerp(p.sy, ty, Math.max(0, k - .08));
    ctx.strokeStyle = rgba(p.c, .8 * (1 - k * .5)); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
  }
  const lk = seg(lt, 1.2, 2.2);
  if (lk > 0) {
    // halo rings
    for (let i = 0; i < 3; i++) {
      const rk = (lt * .5 + i / 3) % 1;
      ctx.strokeStyle = rgba(C.cyan, (1 - rk) * .35 * lk); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, 120 + rk * 260, 0, 6.28); ctx.stroke();
    }
    logo(cx, cy, s * (0.85 + .15 * eback(lk)), lk, lt, lk);
    burst(cx, cy, seg(lt, 1.6, 2.6), C.cyan, 3);
  }
  const tk = seg(lt, 2.0, 3.0);
  if (tk > 0) {
    const str = decode('graph-execution', tk, Math.floor(lt * 30));
    text(str, cx, 690, { font: `800 150px ${SANS}`, align: 'center', color: '#fff', ls: -2, glow: 40, glowColor: C.cyan, double: true, alpha: clamp(tk * 3) });
    // chromatic edges
    text(str, cx - 3, 690, { font: `800 150px ${SANS}`, align: 'center', color: rgba(C.mag, .35), ls: -2, alpha: clamp(tk * 3) });
    text(str, cx + 3, 690, { font: `800 150px ${SANS}`, align: 'center', color: rgba(C.cyan, .35), ls: -2, alpha: clamp(tk * 3) });
    text(str, cx, 690, { font: `800 150px ${SANS}`, align: 'center', color: '#fff', ls: -2, alpha: clamp(tk * 3) });
  }
  const gk = seg(lt, 3.1, 3.8);
  if (gk > 0) {
    text('Turn a spec into a reviewed, tested pull request.', cx, 790 + (1 - eo(gk)) * 20, { font: `400 44px ${SANS}`, align: 'center', color: C.text, alpha: gk });
    const w = 720 * eo(seg(lt, 3.3, 4.3));
    const g = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
    g.addColorStop(0, 'rgba(79,209,255,0)'); g.addColorStop(.5, C.cyan); g.addColorStop(1, 'rgba(180,108,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - w, 830, w * 2, 2);
  }
  const ck = seg(lt, 3.8, 4.4);
  if (ck > 0) {
    const labels = ['PARALLEL AGENTS', 'GIT WORKTREES', 'GATED MERGES', 'REVIEWED + LIVE TESTED'];
    let total = 0; const ws = labels.map(l => { const w = measure(l, `600 17px ${MONO}`, 2) + 28; total += w; return w; }); total += 18 * 3;
    let x = cx - total / 2;
    labels.forEach((l, i) => { const a = seg(lt, 3.8 + i * .12, 4.2 + i * .12); chip(x, 880, l, i % 2 ? C.mag : C.cyan, a, { ls: 2 }); x += ws[i] + 18; });
  }
}

// ---------- scene 2: spec ----------
const TERM = [
  [0.3, '~/workspaces/github/acme/shop', C.muted, 'p'],
  [0.5, '$ claude', C.text, 't'],
  [1.1, '> /to-spec saved carts with share links', C.cyan, 't'],
  [2.0, '● Reading the codebase · 214 files', C.muted, 'p'],
  [2.5, '● Asking 3 questions… answered', C.muted, 'p'],
  [3.0, '● Writing docs/prd/saved-carts.md', C.amber, 'p'],
  [4.6, '  Read the spec. Approve, or ask for changes?', C.text, 'p'],
  [5.0, '> approve', C.green, 't'],
];
function sSpec(lt, dur) {
  kicker('01', 'WRITE THE SPEC', lt, dur);
  const pin = eo(seg(lt, 0, .8)), out = eio(seg(lt, dur - .7, dur));
  const tx = 140 - out * 60, ty = 170 + (1 - pin) * 40;
  panel(tx, ty, 800, 700, { a: pin * (1 - out), title: 'Terminal · Claude Code', right: 'worktree term-1', sweep: seg(lt, .2, 2) });
  ctx.save(); ctx.globalAlpha *= pin * (1 - out);
  let y = ty + 110;
  for (const [st, s, c, kind] of TERM) {
    if (lt < st) break;
    const str = kind === 't' ? typed(s, lt, st, 34) : s;
    const a = kind === 'p' ? seg(lt, st, st + .25) : 1;
    let color = c;
    if (s.startsWith('● Writing') && lt > 4.4) color = C.green;
    text(kind === 'p' && s.startsWith('● Writing') && lt > 4.4 ? '✓ Wrote docs/prd/saved-carts.md' : str, tx + 40, y, { font: `500 24px ${MONO}`, color, alpha: a });
    y += 54;
  }
  // block cursor
  if (Math.floor(lt * 2.5) % 2 === 0) { ctx.fillStyle = C.cyan; ctx.fillRect(tx + 40, y - 22, 14, 26); }
  ctx.restore();

  // spec panel
  const sk = eo(seg(lt, 2.8, 3.6));
  if (sk > 0) {
    const fy = Math.sin(lt * 1.5) * 6;
    const sx = 1000 + (1 - sk) * 180 + out * 260, sy = 170 + fy - out * 30;
    const sa = sk * (1 - out * .2);
    panel(sx, sy, 780, 700, { a: sa, title: 'saved-carts.md', right: 'live', glowColor: 'rgba(180,108,255,0.4)', sweep: seg(lt, 3, 5) });
    ctx.save(); ctx.globalAlpha *= sa;
    const w = lt - 3.0; // seconds of writing
    const rows = [
      ['# Saved carts', 'h1'], ['## Problem', 'h2'], ['bar', 520], ['bar', 610], ['## Goals', 'h2'], ['• KAN-41  save a cart', 'li'], ['• KAN-42  share it with a link', 'li'],
      ['diagram'], ['## Acceptance criteria', 'h2'], ['bar', 560], ['bar', 470],
    ];
    let yy = sy + 104; const x0 = sx + 40;

    text('major · share token', x + 20, y + 78, { font: `500 18px ${MONO}`, color: C.muted });
    const fk = seg(r, F.s + .8, F.s + 1.2);
    text('never expires', x + 20, y + 108, { font: `500 18px ${MONO}`, color: C.muted, alpha: 1 - fk * .6 });
    if (fk > 0) { ctx.strokeStyle = C.red; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 20, y + 102); ctx.lineTo(x + 20 + 150 * fk, y + 102); ctx.stroke(); }
    const ok = seg(r, F.s + 1.1, F.s + 1.4);

  });
  // PR node glow

  if (pk > 0) burst(P.x + NW / 2, P.y + NH / 2, pk, C.cyan, 99);
  ctx.restore();
  lanes(r, seg(lt, .3, 1) * (1 - seg(lt, 11.8, 12.6)));
  hudStats(r, seg(lt, .3, 1) * (1 - seg(lt, 11.8, 12.6)));

  ctx.restore();
  if (lt < 12.4) caption('Independent tasks run at once — any agent, each in its own git worktree.', lt, 12.4, 1035);
  else caption('Every task is gated. Then a reviewer, a live tester and a fixer check the whole result.', lt - 12.4, dur - 12.4, 1035);
}

// ---------- scene 6: PR ----------
function sPR(lt, dur) {
  kicker('05', 'SHIP THE PULL REQUEST', lt, dur);
  const pin = eo(seg(lt, 0, .7)), out = seg(lt, dur - .6, dur);
  const x = 360, y = 180, w = 1200, h = 720;
  panel(x, y + (1 - pin) * 40, w, h, { a: pin * (1 - out), title: 'graph-execution · Run 7f3a', right: 'done', sweep: seg(lt, .3, 2.5) });
  ctx.save(); ctx.globalAlpha *= pin * (1 - out);
  // phase strip
  const phases = ['Tasks 7/7', 'Validation', 'Review + live test', 'Fixer', 'Landed'];
  let px = x + 40;
  phases.forEach((p, i) => {
    const pw = (w - 80 - 4 * 14) / 5;
    rr(px, y + 84, pw, 64, 10); ctx.fillStyle = rgba(C.green, .1); ctx.fill(); ctx.strokeStyle = rgba(C.green, .55); ctx.lineWidth = 1.2; ctx.stroke();
    check(px + 26, y + 116, 20, C.green, seg(lt, .3 + i * .1, .6 + i * .1));
    text(p, px + 46, y + 123, { font: `600 19px ${SANS}`, color: C.text });
    px += pw + 14;
  });
  // branch flow
  const by = y + 250;
  const bk = eio(seg(lt, 1.7, 2.6));
  const bw1 = chip(x + 60, by - 20, 'graph/run-7f3a', C.mag, seg(lt, .5, .9), { font: `600 22px ${MONO}`, h: 44 });
  const mx = x + 60 + bw1 + 30, ex = x + w - 260;
  ctx.strokeStyle = 'rgba(143,153,187,.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(mx, by + 2); ctx.lineTo(ex - 20, by + 2); ctx.stroke();
  if (bk > 0) {
    const g = ctx.createLinearGradient(mx, 0, ex, 0); g.addColorStop(0, C.mag); g.addColorStop(1, C.cyan);
    ctx.strokeStyle = g; ctx.shadowColor = C.cyan; ctx.shadowBlur = 16; ctx.beginPath(); ctx.moveTo(mx, by + 2); ctx.lineTo(lerp(mx, ex - 20, bk), by + 2); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(lerp(mx, ex - 20, bk), by + 2, 7, 0, 6.28); ctx.fill();
  }
  text('Merge into', (mx + ex) / 2, by - 18, { font: `500 16px ${MONO}`, color: C.muted, align: 'center', alpha: seg(lt, .5, .9) });
  chip(ex, by - 20, 'main', C.cyan, seg(lt, .5, .9), { font: `600 22px ${MONO}`, h: 44 });
  // button + cursor
  const btnX = x + w - 300, btnY = y + 330;
  const press = seg(lt, 1.45, 1.6) * (1 - seg(lt, 1.6, 1.8));
  const clicked = lt > 1.55;
  ctx.save(); ctx.translate(btnX + 120, btnY + 30); ctx.scale(1 - press * .06, 1 - press * .06);
  rr(-120, -30, 240, 60, 12); ctx.fillStyle = clicked ? C.green : C.cyan; ctx.shadowColor = clicked ? C.green : C.cyan; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
  text(clicked ? 'PR opened ✓' : 'Create PR', 0, 9, { font: `800 24px ${SANS}`, color: '#04121a', align: 'center' });
  ctx.restore();
  ripple(btnX + 120, btnY + 30, seg(lt, 1.55, 2.2));
  const cpk = eio(seg(lt, .5, 1.4));
  if (lt < 2.6) cursor(lerp(x + 700, btnX + 150, cpk), lerp(y + 640, btnY + 38, cpk), press);
  // PR card
  const ck = eo(seg(lt, 2.2, 2.9));
  if (ck > 0) {
    const cx = x + 40, cy = y + 420 + (1 - ck) * 30;
    ctx.save(); ctx.globalAlpha *= ck;
    rr(cx, cy, w - 80, 270, 14); ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fill(); ctx.strokeStyle = rgba(C.cyan, .45); ctx.lineWidth = 1.3; ctx.stroke();
    chip(cx + 24, cy + 24, 'OPEN', C.green, 1, { ls: 2 });
    text('#128  Saved carts with share links', cx + 130, cy + 50, { font: `800 30px ${SANS}`, color: '#fff' });
    text('+1,284  −96   ·   7 tasks   ·   1 major fixed   ·   spec → docs/prd/done/', cx + 26, cy + 100, { font: `500 19px ${MONO}`, color: C.muted });
    ['qa · ubuntu', 'qa · macos', 'qa · windows'].forEach((s, i) => {
      const xx = cx + 26 + i * 330, yy = cy + 170;
      const dk = seg(lt, 3.0 + i * .35, 3.3 + i * .35);
      rr(xx, yy - 30, 300, 56, 10); ctx.fillStyle = rgba(dk >= 1 ? C.green : C.amber, .08); ctx.fill(); ctx.strokeStyle = rgba(dk >= 1 ? C.green : C.amber, .45); ctx.stroke();
      if (dk >= 1) check(xx + 30, yy - 2, 22, C.green, 1); else spinner(xx + 30, yy - 2, 10, lt, C.amber);
      text(s, xx + 56, yy + 5, { font: `600 19px ${MONO}`, color: C.text });
    });
    const rk = seg(lt, 4.1, 4.4);
    if (rk > 0) {
      ctx.save(); ctx.translate(cx + w - 230, cy + 50); const sc = lerp(1.8, 1, eo(rk)); ctx.scale(sc, sc); ctx.globalAlpha *= rk;
      chip(-110, -22, 'READY TO MERGE', C.green, 1, { ls: 2, h: 40 });
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();
  caption('One click pushes the run branch and opens the pull request.', lt, dur);
}

// ---------- scene 7: everywhere ----------
function iconDesktop(x, y, c) { ctx.strokeStyle = c; ctx.lineWidth = 3; rr(x - 60, y - 40, 120, 76, 8); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 24, y + 56); ctx.lineTo(x + 24, y + 56); ctx.moveTo(x, y + 36); ctx.lineTo(x, y + 56); ctx.stroke(); logo(x, y - 2, 38, 1, 0, 1); }
function iconPhone(x, y, c) { ctx.strokeStyle = c; ctx.lineWidth = 3; rr(x - 32, y - 56, 64, 112, 12); ctx.stroke(); ctx.fillStyle = c; ctx.fillRect(x - 10, y + 42, 20, 3); logo(x, y - 6, 34, 1, 0, 1); }
function iconRepos(x, y, c, t) {
  [-70, 0, 70].forEach((dx, i) => { ctx.strokeStyle = i === 1 ? C.mag : c; ctx.lineWidth = 3; rr(x + dx - 26, y - 20, 52, 40, 8); ctx.stroke(); });
  ctx.strokeStyle = rgba(c, .6); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 70, y + 20); ctx.lineTo(x - 70, y + 50); ctx.lineTo(x + 70, y + 50); ctx.lineTo(x + 70, y + 20); ctx.moveTo(x, y + 20); ctx.lineTo(x, y + 50); ctx.stroke();
}
function iconBox(x, y, c, t) {
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y - 50); ctx.lineTo(x + 56, y - 22); ctx.lineTo(x + 56, y + 36); ctx.lineTo(x, y + 62); ctx.lineTo(x - 56, y + 36); ctx.lineTo(x - 56, y - 22); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 56, y - 22); ctx.lineTo(x, y + 6); ctx.lineTo(x + 56, y - 22); ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 62); ctx.stroke();
  ctx.fillStyle = C.mag; ctx.shadowColor = C.mag; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(x, y + 30, 7 + Math.sin(t * 5) * 2, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
}
function sEverywhere(lt, dur) {
  kicker('06', 'RUNS WHERE YOU WORK', lt, dur);
  const tiles = [
    ['Web app', 'graph-execution manager', 'Workspaces, terminals, live runs.', (x, y, c) => iconDesktop(x, y, c)],
    ['Desktop + phone', 'macOS · Windows · home screen', 'The same app, wherever you are.', (x, y, c) => iconPhone(x, y, c)],
    ['Multi-repo', 'one change across repos', 'A joint check, then one PR per repo.', (x, y, c, t) => iconRepos(x, y, c, t)],
    ['Sandboxed', 'one container per run', 'Agents never see your tokens.', (x, y, c, t) => iconBox(x, y, c, t)],
  ];
  const out = seg(lt, dur - .6, dur);
  const tw = 380, th = 470, gap = 30, x0 = (W - (tw * 4 + gap * 3)) / 2, y0 = 210;
  tiles.forEach(([t1, t2, t3, ic], i) => {
    const k = eo(seg(lt, .1 + i * .18, .8 + i * .18));
    if (k <= 0) return;
    const x = x0 + i * (tw + gap), y = y0 + Math.sin(lt * 1.4 + i) * 6;
    ctx.save(); ctx.translate(x + tw / 2, y + th / 2); ctx.scale(1, k); ctx.translate(-x - tw / 2, -y - th / 2);
    const c = i % 2 ? C.mag : C.cyan;
    panel(x, y, tw, th, { a: k * (1 - out), glowColor: rgba(c, .35), sweep: seg(lt, .5 + i * .2, 2 + i * .2) });
    ctx.globalAlpha *= (1 - out);
    ctx.save(); ic(x + tw / 2, y + 150, c, lt); ctx.restore();
    text(t1, x + tw / 2, y + 290, { font: `800 34px ${SANS}`, color: '#fff', align: 'center' });
    text(t2, x + tw / 2, y + 330, { font: `500 18px ${MONO}`, color: c, align: 'center' });
    text(t3, x + tw / 2, y + 400, { font: `400 21px ${SANS}`, color: C.muted, align: 'center' });
    ctx.restore();
  });
  // providers marquee
  const pa = seg(lt, 1.2, 1.8) * (1 - out);
  if (pa > 0) {
    text('WORKS WITH', W / 2, 770, { font: `700 16px ${MONO}`, color: C.muted, align: 'center', ls: 5, alpha: pa });
    const names = Object.values(PROV);
    let total = names.reduce((s, [n]) => s + measure(n, `600 17px ${MONO}`) + 46 + 16, -16);
    let x = W / 2 - total / 2;
    names.forEach(([n, c], i) => { x += chip(x, 795, n, c, seg(lt, 1.3 + i * .12, 1.7 + i * .12) * (1 - out), { dot: true }) + 16; });
  }
  caption('Runs on your machine. You choose the agent.', lt, dur, 960);
}

// ---------- scene 8: outro ----------
function sOutro(lt, dur) {
  const cx = W / 2;
  const k = eo(seg(lt, 0, 1));
  // radial burst lines
  ctx.save();
  for (let i = 0; i < 48; i++) {
    const ang = i / 48 * 6.28 + lt * .05, r1 = 160 + (1 - k) * 200, r2 = r1 + 60 + hash(i) * 260 * k;
    ctx.strokeStyle = rgba(i % 2 ? C.mag : C.cyan, .18 * k); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * r1, 330 + Math.sin(ang) * r1); ctx.lineTo(cx + Math.cos(ang) * r2, 330 + Math.sin(ang) * r2); ctx.stroke();
  }
  ctx.restore();
  logo(cx, 330, 210 * (.8 + .2 * eback(seg(lt, 0, .8))), seg(lt, 0, .5), lt, seg(lt, 0, 1));
  const tk = seg(lt, .5, 1.4);
  const str = decode('graph-execution', tk, Math.floor(lt * 30));
  text(str, cx, 590, { font: `800 120px ${SANS}`, align: 'center', color: '#fff', ls: -2, glow: 36, glowColor: C.cyan, double: true, alpha: clamp(tk * 3) });
  text('Spec in. Reviewed, tested pull request out.', cx, 670, { font: `400 38px ${SANS}`, align: 'center', color: C.text, alpha: seg(lt, 1.3, 1.9) });
  const ck = eo(seg(lt, 1.9, 2.6));
  if (ck > 0) {
    const cmd = 'npm install -g graph-execution && graph-execution manager';
    const f = `600 28px ${MONO}`, cw = measure(cmd, f) + 90;
    ctx.save(); ctx.globalAlpha *= ck;
    rr(cx - cw / 2, 730, cw, 72, 36); ctx.fillStyle = 'rgba(79,209,255,0.08)'; ctx.fill();
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.shadowColor = C.cyan; ctx.shadowBlur = 26; ctx.stroke(); ctx.shadowBlur = 0;
    text('$', cx - cw / 2 + 34, 776, { font: f, color: C.mag });
    text(typed(cmd, lt, 2.0, 40), cx - cw / 2 + 64, 776, { font: f, color: '#fff' });
    ctx.restore();
  }
  const uk = seg(lt, 3.6, 4.2);
  if (uk > 0) text('graph-execution.com', cx, 880, { font: `700 34px ${SANS}`, align: 'center', color: C.cyan, ls: 4, glow: 20, alpha: uk });
}

// ---------- timeline ----------
const SCENES = [
  [0, 5.2, sIntro],
  [5.0, 11.4, sSpec],
  [11.2, 16.6, sTasks],
  [RUN0, 36.4, sRun],
  [36.2, 41.6, sPR],
  [41.4, 46.6, sEverywhere],
  [46.4, DUR, sOutro],
];
const CUTS = [5.0, 11.2, 16.5, 28.9, 36.2, 41.4, 46.4];
const noise = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; } x.putImageData(d, 0, 0); return c; })();

function hudFrame(t) {
  // top-left brand, timecode, progress segments, corners
  ctx.save();
  const a = seg(t, 4.6, 5.4) * (1 - seg(t, 46, 46.6));
  if (a > 0) {
    ctx.globalAlpha = a;
    logo(1745, 100, 30, 1, t, 1);
    text('graph-execution', 1725, 108, { font: `700 20px ${SANS}`, color: C.text, align: 'right' });
    const s = t - 5;
    text(`T+${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`, 1772, 140, { font: `500 15px ${MONO}`, color: C.muted, align: 'right' });
    if (t > 16.5 && t < 36) { /* hud stats occupy top right; move timecode down handled */ }
  }
  ctx.restore();
  // progress
  const n = 8, sw = (W - 280 - (n - 1) * 10) / n;
  for (let i = 0; i < n; i++) {
    const s0 = i * DUR / n, k = seg(t, s0, s0 + DUR / n);
    ctx.fillStyle = 'rgba(143,153,187,.18)'; ctx.fillRect(140 + i * (sw + 10), 36, sw, 3);
    ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 8; ctx.fillRect(140 + i * (sw + 10), 36, sw * k, 3); ctx.shadowBlur = 0;
  }
  brackets(40, 40, W - 80, H - 80, 40, 'rgba(79,209,255,.35)');
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // gentle camera push per scene
  drawBg(t);
  for (const [a, b, fn] of SCENES) {
    if (t < a || t > b) continue;
    const al = seg(t, a, a + .35) * (1 - seg(t, b - .35, b));
    const lt = t - a;
    ctx.save();
    ctx.globalAlpha = fn === sRun ? 1 : al;
    const z = fn === sRun || fn === sTasks ? 1 : 1 + lt * .004;
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    fn(lt, b - a, t);
    ctx.restore();
  }
  // HUD: hide brand/timecode while run HUD stats shown
  if (!(t > 16.7 && t < 28.9)) hudFrame(t); else { ctx.save(); hudFrameMinimal(t); ctx.restore(); }
  // glitch at cuts
  for (const c of CUTS) {
    const d = t - c;
    if (d > -0.06 && d < 0.2) {
      const r = rng(Math.floor(t * 60) + 1);
      const amt = 1 - Math.abs(d - .05) / .2;
      for (let i = 0; i < 9; i++) {
        const y = r() * H, h = 8 + r() * 60, dx = (r() - .5) * 120 * amt;
        ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(79,209,255,${.10 * amt})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
  }
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // grain
  const ox = Math.floor(hash(Math.floor(t * 30)) * 256), oy = Math.floor(hash(Math.floor(t * 30) + 7) * 256);
  ctx.save(); ctx.globalCompositeOperation = 'overlay';
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(noise, x, y);
  ctx.restore();
  // fade in/out
  const f = Math.min(seg(t, 0, .4), 1 - seg(t, DUR - .8, DUR));
  if (f < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0, 0, W, H); }
}
function hudFrameMinimal(t) {
  const n = 8, sw = (W - 280 - (n - 1) * 10) / n;
  for (let i = 0; i < n; i++) {
    const s0 = i * DUR / n, k = seg(t, s0, s0 + DUR / n);
    ctx.fillStyle = 'rgba(143,153,187,.18)'; ctx.fillRect(140 + i * (sw + 10), 36, sw, 3);
    ctx.fillStyle = C.cyan; ctx.fillRect(140 + i * (sw + 10), 36, sw * k, 3);
  }
  brackets(40, 40, W - 80, H - 80, 40, 'rgba(79,209,255,.35)');
}
window.DUR = DUR;
window.renderFrame = renderFrame;
window.ready = Promise.all([
  document.fonts.load(`800 40px Inter`), document.fonts.load(`400 40px Inter`), document.fonts.load(`500 40px Inter`), document.fonts.load(`700 40px Inter`), document.fonts.load(`900 40px Inter`), document.fonts.load(`600 40px Inter`),
  document.fonts.load(`500 20px "DejaVu Sans Mono"`),
]);
if (!location.search.includes('render')) {
  const t0 = performance.now(); const p = new URLSearchParams(location.search); const off = +(p.get('t') || 0);
  (function loop() { renderFrame(((performance.now() - t0) / 1000 + off) % DUR); requestAnimationFrame(loop); })();
}

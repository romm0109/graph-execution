<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph-execution</title>
<style>
:root {
  --bg: #f6f8fa; --panel: #ffffff; --text: #1f2328; --muted: #6b7689; --faint: #c4cad4;
  --accent: #0086a8; --accent2: #c2188f; --ok: #12a150; --warn: #b7791f; --bad: #d1242f; --validating: #7c4dff;
  --diff-add: #dafbe1; --diff-add-gutter: #aceebb; --diff-add-mark: #116329;
  --diff-del: #ffebe9; --diff-del-gutter: #ffcecb; --diff-del-mark: #82071e;
  --diff-hunk: #ddf4ff; --diff-hunk-gutter: #b6e3ff;
  --syn-comment: #6e7781; --syn-string: #0a3069; --syn-keyword: #cf222e; --syn-number: #0550ae;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #6b7689; --faint: #3b4252;
    --accent: #00e5ff; --accent2: #ff4fd8; --ok: #39ff88; --warn: #ffd166; --bad: #ff3860; --validating: #b388ff;
    --diff-add: rgba(46, 160, 67, 0.15); --diff-add-gutter: rgba(63, 185, 80, 0.3); --diff-add-mark: #3fb950;
    --diff-del: rgba(248, 81, 73, 0.15); --diff-del-gutter: rgba(248, 81, 73, 0.3); --diff-del-mark: #f85149;
    --diff-hunk: rgba(56, 139, 253, 0.1); --diff-hunk-gutter: rgba(56, 139, 253, 0.25);
    --syn-comment: #8b949e; --syn-string: #a5d6ff; --syn-keyword: #ff7b72; --syn-number: #79c0ff;
  }
}
body { margin: 0; background: var(--bg); color: var(--text); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
header { display: flex; gap: 16px; align-items: baseline; padding: 12px 16px; flex-wrap: wrap; min-height: 30px; }
header .title { font-weight: bold; color: var(--accent); font-size: 16px; }
header .meta, #progress { color: var(--muted); }
#conn { color: var(--bad); font-weight: bold; }
#phases { display: flex; gap: 8px; padding: 0 16px 8px; align-items: center; min-height: 1.4em; }
.phase { color: var(--muted); }
.phase.current { color: var(--accent); font-weight: bold; }
.phase.past { color: var(--ok); }
#graph { padding: 8px 16px; overflow: auto; }
svg { display: block; margin: 0 auto; }
.edge { fill: none; stroke-width: 1.5; }
.node rect { fill: var(--panel); stroke-width: 1.5; }
.node.active rect { stroke-width: 3; }
.node text { font: 12px ui-monospace, Menlo, monospace; }
.node .ttl { fill: var(--text); font-weight: bold; }
.node.active .ttl { fill: var(--accent); }
.node.clickable { cursor: pointer; }
.spin { animation: spin 900ms linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
#events { margin: 8px 16px 16px; padding: 8px 12px; background: var(--panel); border-radius: 6px; line-height: 1.4; min-height: 7em; }
#events div { white-space: pre-wrap; color: var(--muted); }
#events .t { color: var(--faint); margin-right: 8px; }
header button { margin-left: auto; font: inherit; padding: 4px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--panel); color: var(--text); border-radius: 6px; }
header button.abort { border-color: var(--bad); }
.node.retryable rect { stroke: var(--bad); stroke-width: 3; }
.node .badge { fill: var(--bad); font-size: 10px; font-weight: bold; }
#main { display: block; }
#main.withpanel { display: grid; grid-template-columns: minmax(0, 1fr) min(520px, 45vw); align-items: start; }
@media (max-width: 900px) { #main.withpanel { display: block; } }
#panel { margin: 8px 16px 0; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--accent); overflow: auto; max-height: calc(100vh - 90px); position: sticky; top: 8px; }
#panel .phead { display: flex; gap: 8px; align-items: baseline; }
#panel .ftitle { font-weight: bold; flex: 1; }
#panel .close { font: inherit; padding: 0 8px; cursor: pointer; border: 1px solid var(--faint); background: var(--panel); color: var(--text); border-radius: 6px; margin: 0; }
#panel .fail { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--faint); }
#panel pre { margin: 4px 0; white-space: pre-wrap; }
#panel .verdict.likely_to_work { color: var(--ok); }
#panel .verdict.unlikely_to_help { color: var(--bad); }
#panel .verdict.unclear { color: var(--warn); }
#panel .err { color: var(--bad); }
#panel .fail button { font: inherit; padding: 4px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--panel); color: var(--text); border-radius: 6px; margin-top: 6px; }
#panel .totals { margin: 8px 0 4px; color: var(--muted); }
#panel .plan { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--faint); }
#panel .plan .phdr { color: var(--muted); margin-bottom: 4px; }
.plan .crow { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; }
.plan .ctitle { flex: 1; overflow-wrap: anywhere; }
.badge.v-pass { color: var(--ok); border-color: var(--ok); }
.badge.v-fail { color: var(--bad); border-color: var(--bad); }
.badge.v-blocked { color: var(--warn); border-color: var(--warn); }
#panel .none { color: var(--muted); margin-top: 8px; }
.files { list-style: none; margin: 0; padding: 0; }
.files .frow { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; }
.files .path { flex: 1; overflow-wrap: anywhere; }
.add { color: var(--ok); }
.del { color: var(--bad); }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--faint); border-radius: 4px; padding: 0 4px; }
pre.diff { margin: 2px 0 6px; padding: 4px 0; white-space: pre; overflow-x: auto; background: var(--bg); border-radius: 4px; font-size: 12px; }
pre.diff div { padding: 0 6px; min-width: max-content; }
pre.diff .dl { display: flex; padding: 0; line-height: 1.5; }
pre.diff .ln { flex: none; width: 4ch; padding: 0 6px; text-align: right; color: var(--muted); user-select: none; }
pre.diff .mk { flex: none; width: 2ch; padding: 0; text-align: center; user-select: none; }
pre.diff .code { padding-right: 8px; }
pre.diff .l-add { background: var(--diff-add); }
pre.diff .l-add .ln, pre.diff .l-add .mk { background: var(--diff-add-gutter); color: var(--diff-add-mark); }
pre.diff .l-del { background: var(--diff-del); }
pre.diff .l-del .ln, pre.diff .l-del .mk { background: var(--diff-del-gutter); color: var(--diff-del-mark); }
pre.diff .l-hunk { background: var(--diff-hunk); color: var(--muted); }
pre.diff .l-hunk .ln { background: var(--diff-hunk-gutter); }
pre.diff .note { color: var(--muted); font-style: italic; }
pre.diff .tk-c { color: var(--syn-comment); font-style: italic; }
pre.diff .tk-s { color: var(--syn-string); }
pre.diff .tk-k { color: var(--syn-keyword); }
pre.diff .tk-n { color: var(--syn-number); }
.node.sel rect { stroke-width: 4; stroke: var(--accent); }
#review { margin: 8px 16px; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--warn); }
#review h3 { margin: 0 0 6px; }
#review button { margin-right: 8px; }
#review .err { color: var(--bad); }
#reviewdiff { margin: 8px 16px; padding: 8px 12px; background: var(--panel); border-radius: 6px; }
#reviewdiff button { font: inherit; padding: 2px 10px; cursor: pointer; border: 1px solid var(--accent); background: var(--panel); color: var(--text); border-radius: 6px; margin-right: 6px; }
#reviewdiff textarea { display: block; width: 100%; box-sizing: border-box; min-height: 56px; margin: 4px 0; font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--faint); border-radius: 4px; }
#reviewdiff .cmt { margin: 4px 0; padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--bg); white-space: pre-wrap; }
#reviewdiff .cmt .meta { color: var(--muted); font-size: 11px; }
#reviewdiff .prev pre { margin: 4px 0; white-space: pre-wrap; }
#reviewdiff .crow { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
#reviewdiff .err { color: var(--bad); }
pre.diff .pick { cursor: pointer; text-decoration: underline; }
pre.diff .cmtbox { white-space: normal; font-family: inherit; }
#summary { margin: 8px 16px 16px; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--faint); }
#summary .stitle { font-weight: bold; margin-bottom: 8px; }
#summary h3 { margin: 12px 0 4px; font-size: 14px; }
#summary pre { margin: 0; white-space: pre-wrap; }
#summary .add { color: var(--ok); }
#summary .del { color: var(--bad); }
</style>
</head>
<body>
<header>
  <span class="title">graph-execution</span>
  <span class="meta" id="runid"></span>
  <span class="meta" id="provider"></span>
  <span class="meta" id="elapsed"></span>
  <span id="progress"></span>
  <span id="conn"></span>
  <button id="action" type="button" hidden></button>
</header>
<div id="phases"></div>
<section id="review" hidden></section>
<section id="reviewdiff" hidden></section>
<div id="main"><div id="graph"></div>
<aside id="panel" hidden></aside></div>
<div id="events"></div>
<div id="summary" hidden></div>
<script>
"use strict";
const SPIN_MS = 900;
const SVGNS = "http://www.w3.org/2000/svg";
const PHASES = ["tasks", "validate", "review", "fix", "human", "done"];
const NODE_W = 180, NODE_H = 46, GAP_X = 28, GAP_Y = 44, PAD = 12;
const ACTIVE = new Set(["running", "validating", "fixing", "merging"]);
const COLOR = {
  pending: "--muted", running: "--accent", validating: "--validating", fixing: "--warn", merging: "--accent2",
  merged: "--ok", done: "--ok", failed: "--bad", skipped: "--faint",
};
const ICON = { pending: "○", merged: "✔", done: "✔", failed: "✖", skipped: "⊘" };
let state = null;
let firstError = 0;
let endedAt = 0;
let disconnected = false;
let selected = null;
let panelId = null;
let expanded = new Set();
let planOpen = new Set();
let diffs = new Map();
let rows = new Map();

const el = (name, attrs, text) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
};
const v = (name) => "var(" + name + ")";

function statusText(n) {
  if (n.status === "running" && n.attempt > 1) return "retry " + n.attempt + "/" + n.attempts;
  if (n.status === "fixing" && n.round !== undefined) return "fixing " + n.round + "/" + (n.rounds ?? "?");
  if (n.status === "validating" && n.round) return "revalidate " + n.round + "/" + (n.rounds ?? "?");
  return n.status;
}
function phaseLabel(p) {
  const round = p.round || 0;
  if (p.phase === "review") return "review round " + round;
  if (p.phase === "fix") {
    const pass = p.fixPasses === undefined ? "fix pass " + round : "fix pass " + round + "/" + p.fixPasses;
    return p.humanRound ? pass + " (human round " + p.humanRound + ")" : pass;
  }
  if (p.phase === "human") return "human review " + round;
  return p.phase;
}
const compact = (n) => (n > 999 ? (n / 1000).toFixed(1) + "k" : String(n));
const truncate = (s, max) => (s.length <= max ? s : s.slice(0, Math.max(1, max - 1)) + "…");
function elapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = (n) => String(n).padStart(2, "0");
  return Math.floor(s / 3600) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60);
}

function renderHeader(s) {
  document.title = "graph-execution " + s.runId;
  document.getElementById("runid").textContent = "run " + s.runId;
  document.getElementById("provider").textContent = s.provider;
  const tasks = s.graph.nodes.filter((n) => !n.id.startsWith("@"));
  const merged = tasks.filter((n) => n.view.status === "merged").length;
  document.getElementById("progress").textContent = merged + "/" + tasks.length + " tasks merged";
  const bar = document.getElementById("phases");
  bar.replaceChildren();
  const cur = PHASES.indexOf(s.phase.phase);
  PHASES.forEach((p, i) => {
    if (i > 0) bar.append(Object.assign(document.createElement("span"), { textContent: "→", className: "phase" }));
    const span = document.createElement("span");
    span.className = "phase" + (i === cur ? " current" : i < cur ? " past" : "");
    span.textContent = i === cur ? phaseLabel(s.phase) : p;
    bar.append(span);
  });
}
function tickElapsed() {
  if (!state || closed) return;
  if (state.summary && !endedAt) endedAt = Date.now();
  const end = endedAt || Date.now();
  document.getElementById("elapsed").textContent = elapsed(end - state.startedAt);
}

function renderGraph(s) {
  const { nodes, layers, parents } = s.graph;
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const widest = Math.max(1, ...layers.map((l) => l.length));
  const width = PAD * 2 + widest * NODE_W + (widest - 1) * GAP_X;
  const height = PAD * 2 + layers.length * NODE_H + (layers.length - 1) * GAP_Y;
  const pos = new Map();
  layers.forEach((layer, row) => {
    const rowW = layer.length * NODE_W + (layer.length - 1) * GAP_X;
    const x0 = (width - rowW) / 2;
    layer.forEach((id, i) => pos.set(id, { x: x0 + i * (NODE_W + GAP_X), y: PAD + row * (NODE_H + GAP_Y) }));
  });
  const svg = el("svg", { width, height, viewBox: "0 0 " + width + " " + height, role: "img" });
  const edges = el("g");
  for (const id in parents) {
    const to = pos.get(id);
    if (!to) continue;
    for (const pid of parents[id]) {
      const from = pos.get(pid);
      const src = byId.get(pid);
      if (!from || !src) continue;
      const x1 = from.x + NODE_W / 2, y1 = from.y + NODE_H, x2 = to.x + NODE_W / 2, y2 = to.y;
      const my = (y1 + y2) / 2;
      const st = src.view.status;
      const color = st === "merged" || st === "done" ? "--ok" : st === "pending" || st === "skipped" ? "--faint" : COLOR[st];
      edges.append(el("path", { class: "edge", d: "M" + x1 + " " + y1 + " C" + x1 + " " + my + " " + x2 + " " + my + " " + x2 + " " + (y2 - 4), stroke: v(color) }));
      edges.append(el("path", { d: "M" + (x2 - 4) + " " + (y2 - 7) + " L" + x2 + " " + y2 + " L" + (x2 + 4) + " " + (y2 - 7) + " Z", fill: v(color) }));
    }
  }
  svg.append(edges);
  for (const [id, p] of pos) {
    const n = byId.get(id);
    if (!n) continue;
    const active = ACTIVE.has(n.view.status);
    const color = v(COLOR[n.view.status]);
    const isRetryable = (s.retryable || []).includes(id);
    const failed = n.view.status === "failed";
    const g = el("g", { class: "node" + (active ? " active" : "") + (isRetryable ? " retryable" : "") + " clickable" + (id === selected ? " sel" : ""), "data-node-id": id, transform: "translate(" + p.x + " " + p.y + ")" });
    g.append(el("rect", { width: NODE_W, height: NODE_H, rx: 8, stroke: color }));
    g.append(el("text", { class: "ttl", x: 10, y: 19 }, truncate(n.title, 24)));
    if (active) {
      const slot = el("g", { transform: "translate(18 33)" });
      slot.append(el("path", { class: "spin", style: "animation-delay: -" + Math.round(performance.now() % SPIN_MS) + "ms", d: "M0 -5 A5 5 0 1 1 -5 0", fill: "none", stroke: color, "stroke-width": 2 }));
      g.append(slot);
    }
    else g.append(el("text", { x: 14, y: 37, fill: color }, ICON[n.view.status] || ""));
    g.append(el("text", { x: 30, y: 37, fill: color }, truncate(statusText(n.view), 20)));
    const tot = n.view.changes && n.view.changes.total;
    if (tot && tot.files > 0) {
      const t = el("text", { x: NODE_W - 10, y: 37, "text-anchor": "end" });
      t.append(el("tspan", { fill: v("--ok") }, "+" + compact(tot.added)), el("tspan", { fill: v("--bad") }, " \u2212" + compact(tot.deleted)));
      g.append(t);
    }
    if (isRetryable) g.append(el("text", { class: "badge", x: NODE_W - 38, y: 19 }, "retry"));
    svg.append(g);
  }
  document.getElementById("graph").replaceChildren(svg);
}

const VERDICT = { likely_to_work: "Retry: likely to work", unlikely_to_help: "Retry: unlikely to help", unclear: "Retry: unclear" };
function para(cls, text) {
  const p = document.createElement("pre");
  if (cls) p.className = cls;
  p.textContent = text;
  return p;
}
async function onRetry(id, errBox) {
  try {
    const res = await fetch("/retry/" + encodeURIComponent(id), { method: "POST" });
    if (res.ok) { selected = null; renderGraph(state); renderPanel(state); return; }
    let msg = "Retry failed (" + res.status + ")";
    try { msg = (await res.json()).error || msg; } catch (e) { /* keep the status */ }
    errBox.textContent = msg;
  } catch (e) { errBox.textContent = "Retry failed: disconnected"; }
}
async function onMerge(s, errBox) {
  if (!confirm("Apply what the run has done so far to " + (s.mergeTarget || "your branch") + " as uncommitted changes and end the run?")) return;
  try {
    const res = await fetch("/merge", { method: "POST" });
    if (res.ok) { selected = null; renderGraph(state); renderPanel(state); return; }
    let msg = "Merge failed (" + res.status + ")";
    try { msg = (await res.json()).error || msg; } catch (e) { /* keep the status */ }
    errBox.textContent = msg;
  } catch (e) { errBox.textContent = "Merge failed: disconnected"; }
}
async function postReview(path, body, errBox) {
  try {
    const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (res.ok) return;
    let msg = "Request failed (" + res.status + ")";
    try { msg = (await res.json()).error || msg; } catch (e) { /* keep the status */ }
    errBox.textContent = msg;
  } catch (e) { errBox.textContent = "Request failed: disconnected"; }
}
function hasOpenComments() {
  return !!(rv && rv.comments && rv.comments.some((c) => c.status !== "resolved"));
}
function syncRequestChanges() {
  const b = document.getElementById("request-changes");
  if (b) b.disabled = !hasOpenComments();
}
function renderReview(s) {
  const el = document.getElementById("review");
  const r = s.review;
  if (!r || !r.waiting) { el.hidden = true; el.replaceChildren(); return; }
  // Rebuilt on every state event: keep the banner (and its error text) while it is the same pause.
  const key = r.round + ":" + r.blocking.map((f) => f.id).join(",");
  if (!el.hidden && el.dataset.key === key) return;
  el.dataset.key = key;
  el.hidden = false;
  const err = para("err", "");
  const target = s.mergeTarget || "your branch";
  const button = (label, onClick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  };
  const children = [Object.assign(document.createElement("h3"), { textContent: "Waiting for your review — round " + r.round })];
  if (r.blocking.length > 0) {
    const ul = document.createElement("ul");
    for (const f of r.blocking) {
      ul.append(Object.assign(document.createElement("li"), { textContent: f.id + " [" + f.severity + "] " + f.description }));
    }
    children.push(para("", r.blocking.length + " open blocker/major finding(s):"), ul);
    children.push(button("Apply anyway", () => {
      if (confirm("Apply with " + r.blocking.length + " open finding(s) to " + target + " as uncommitted changes?")) {
        postReview("/review/apply", { force: true }, err);
      }
    }));
  } else {
    children.push(button(s.mergeTarget ? "Apply" : "Finish", () => postReview("/review/apply", {}, err)));
  }
  const requestChanges = button("Request changes", () => postReview("/review/changes", {}, err));
  requestChanges.id = "request-changes";
  requestChanges.disabled = !hasOpenComments();
  children.push(requestChanges);
  children.push(button("Drop", () => {
    if (confirm("Drop the result? Nothing is applied; it stays on graph/" + s.runId + ".")) postReview("/review/drop", {}, err);
  }));
  children.push(err);
  el.replaceChildren(...children);
}
// Final diff and comments while the run waits for the human's review.
let rv = null; // { round, files, comments, ... } from GET /review
let rvRound = null;
const rvExpanded = new Set();
const rvDiffs = new Map();
async function loadReview(round) {
  try {
    const res = await fetch("/review");
    if (!res.ok) return;
    const data = await res.json();
    if (!data.files) return;
    if (rvRound !== null && rvRound !== data.round) { rvExpanded.clear(); rvDiffs.clear(); }
    rvRound = data.round;
    rv = data;
    renderReviewDiff();
    syncRequestChanges();
  } catch (e) { /* the next state event retries */ }
}
function syncReviewDiff(s) {
  const el = document.getElementById("reviewdiff");
  const r = s.review;
  if (!r || !r.waiting) { rv = null; rvRound = null; el.hidden = true; el.replaceChildren(); rvExpanded.clear(); rvDiffs.clear(); return; }
  if (rv === null || rv.round !== r.round) { if (!rvLoading) { rvLoading = true; loadReview().finally(() => { rvLoading = false; }); } }
}
let rvLoading = false;
async function sendComment(method, path, body, errBox) {
  try {
    const res = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (res.ok) { await loadReview(); return true; }
    let msg = "Request failed (" + res.status + ")";
    try { msg = (await res.json()).error || msg; } catch (e) { /* keep the status */ }
    errBox.textContent = msg;
  } catch (e) { errBox.textContent = "Request failed: disconnected"; }
  return false;
}
function reviewButton(label, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
// A textarea with "needs live check" and Save/Cancel; `onSave(body, liveCheck, err)` resolves true when done.
function commentForm(initial, onSave, onCancel) {
  const box = div("cmtbox");
  const ta = document.createElement("textarea");
  ta.value = initial ? initial.body : "";
  const label = document.createElement("label");
  const check = document.createElement("input");
  check.type = "checkbox";
  check.checked = !!(initial && initial.liveCheck);
  label.append(check, " needs live check");

async function main() {
  document.getElementById("action").addEventListener("click", onAction);
  document.getElementById("graph").addEventListener("click", (ev) => {
    const g = ev.target.closest && ev.target.closest("[data-node-id]");
    if (!g || !state) return;
    selected = g.getAttribute("data-node-id");
    renderGraph(state);
    renderPanel(state);
  });
  try {
    const res = await fetch("/state");
    render(await res.json());
  } catch (e) { /* the event stream retries */ }
  const es = new EventSource("/events");
  source = es;
  es.addEventListener("state", (ev) => {
    firstError = 0;
    disconnected = false;
    showConn();
    render(JSON.parse(ev.data));
  });
  es.onerror = () => {
    const now = Date.now();
    if (!firstError) firstError = now;
    disconnected = true;
    showConn();
    if (now - firstError >= 60000) es.close();
  };
  // EventSource retries on its own; make sure we also give up after a minute without a message.
  timer = setInterval(() => {
    if (firstError && Date.now() - firstError >= 60000) es.close();
    tickElapsed();
  }, 1000);
}
main();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph-execution suite</title>
<style>
/* Dark only, whatever the system theme. */
:root {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #6b7689; --faint: #3b4252;
  --accent: #00e5ff; --accent2: #ff4fd8; --ok: #39ff88; --warn: #ffd166; --bad: #ff3860; --validating: #b388ff;
  --diff-add: rgba(46, 160, 67, 0.15); --diff-add-gutter: rgba(63, 185, 80, 0.3); --diff-add-mark: #3fb950;
  --diff-del: rgba(248, 81, 73, 0.15); --diff-del-gutter: rgba(248, 81, 73, 0.3); --diff-del-mark: #f85149;
  --diff-hunk: rgba(56, 139, 253, 0.1); --diff-hunk-gutter: rgba(56, 139, 253, 0.25);
  --syn-comment: #8b949e; --syn-string: #a5d6ff; --syn-keyword: #ff7b72; --syn-number: #79c0ff;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; }
header { display: flex; gap: 16px; align-items: baseline; padding: 12px 16px; flex-wrap: wrap; min-height: 30px; }
header .title { font-weight: bold; color: var(--accent); font-size: 16px; }
header .meta, #progress { color: var(--muted); }
header .spacer { margin-left: auto; }
#conn, #err { color: var(--bad); font-weight: bold; }
#err { padding: 0 16px; }
#err:empty { display: none; }
button { font: inherit; padding: 4px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--panel); color: var(--text); border-radius: 6px; }
button.abort { border-color: var(--bad); }
button:disabled { opacity: 0.5; cursor: default; }
#phases { display: flex; gap: 8px; padding: 0 16px 8px; align-items: center; min-height: 1.4em; }
.phase { color: var(--muted); }
.phase.current { color: var(--accent); font-weight: bold; }
.phase.past { color: var(--ok); }
#main { flex: 1 1 auto; min-height: 420px; display: block; position: relative; }
#main.withpanel { display: grid; grid-template-columns: minmax(0, 1fr) min(520px, 45vw); }
@media (max-width: 900px) { #main.withpanel { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 1fr) auto; } }
/* The graph is a canvas: drag to pan, scroll to pan, pinch or ctrl+scroll to zoom. */
#graph { position: relative; height: 100%; min-height: 420px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
#graph.panning { cursor: grabbing; }
#graph svg { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; }
#zoom button { padding: 2px 10px; }
#zoom .hint { color: var(--muted); font-size: 12px; margin-right: 6px; }
.edge { fill: none; stroke-width: 1.5; }
.cluster rect { fill: rgba(255, 255, 255, 0.015); stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 6 4; }
.cluster.clickable { cursor: pointer; }
.cluster.sel rect { stroke: var(--accent); stroke-dasharray: none; }
.cluster .ctitle { font: bold 13px ui-monospace, Menlo, monospace; }
.cluster .cmeta { font: 12px ui-monospace, Menlo, monospace; fill: var(--muted); }
.node rect { fill: var(--panel); stroke-width: 1.5; }
.node.active rect { stroke-width: 3; }
.node text { font: 12px ui-monospace, Menlo, monospace; }
.node .ttl { fill: var(--text); font-weight: bold; }
.node.active .ttl { fill: var(--accent); }
.node.clickable { cursor: pointer; }
.node.retryable rect { stroke: var(--bad); stroke-width: 3; }
.node .badge { fill: var(--bad); font-size: 10px; font-weight: bold; }
.node .cbadge { fill: var(--warn); font-size: 10px; font-weight: bold; }
.node.sel rect { stroke-width: 4; stroke: var(--accent); }
.spin { animation: spin 900ms linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
#panel { margin: 8px 16px 8px 0; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--accent); overflow: auto; max-height: calc(100% - 20px); align-self: start; box-sizing: border-box; }
@media (max-width: 900px) { #panel { margin: 8px 16px; max-height: none; } }
#panel .phead { display: flex; gap: 8px; align-items: baseline; }
#panel .ftitle { font-weight: bold; flex: 1; }
#panel .close { padding: 0 8px; border-color: var(--faint); }
#panel .row { color: var(--muted); margin: 4px 0; }
#panel .sec { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--faint); }
#panel .err { color: var(--bad); }
#panel .warn { color: var(--warn); }
#panel .logs pre { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); max-height: 260px; overflow: auto; background: var(--bg); padding: 4px 6px; border-radius: 4px; }
#panel .lhead { cursor: pointer; }
#panel .tasks { list-style: none; margin: 4px 0; padding: 0; }
#panel .tasks li { padding: 2px 0; }
#panel .totals { margin: 8px 0 4px; color: var(--muted); }
#panel .none { color: var(--muted); margin-top: 8px; }
.files { list-style: none; margin: 0; padding: 0; }
.files .frow { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; }
.files .path { flex: 1; overflow-wrap: anywhere; }
.add { color: var(--ok); }
.del { color: var(--bad); }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--faint); border-radius: 4px; padding: 0 4px; }
.badge.conflict { color: var(--warn); border-color: var(--warn); }
pre.diff { margin: 2px 0 6px; padding: 4px 0; white-space: pre; overflow-x: auto; background: var(--bg); border-radius: 4px; font-size: 12px; }
pre.diff div { padding: 0 6px; min-width: max-content; }
pre.diff .dl { display: flex; padding: 0; line-height: 1.5; }
pre.diff .ln { flex: none; width: 4ch; padding: 0 6px; text-align: right; color: var(--muted); user-select: none; }
pre.diff .mk { flex: none; width: 2ch; padding: 0; text-align: center; user-select: none; }
pre.diff .code { padding-right: 8px; }
pre.diff .l-add { background: var(--diff-add); }
pre.diff .l-add .ln, pre.diff .l-add .mk { background: var(--diff-add-gutter); color: var(--diff-add-mark); }
pre.diff .l-del { background: var(--diff-del); }
pre.diff .l-del .ln, pre.diff .l-del .mk { background: var(--diff-del-gutter); color: var(--diff-del-mark); }
pre.diff .l-hunk { background: var(--diff-hunk); color: var(--muted); }
pre.diff .l-hunk .ln { background: var(--diff-hunk-gutter); }
pre.diff .note { color: var(--muted); font-style: italic; }
pre.diff .tk-c { color: var(--syn-comment); font-style: italic; }
pre.diff .tk-s { color: var(--syn-string); }
pre.diff .tk-k { color: var(--syn-keyword); }
pre.diff .tk-n { color: var(--syn-number); }
#summary { margin: 0 16px 8px; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--faint); }
#summary .stitle { font-weight: bold; margin-bottom: 4px; }
#summary pre { margin: 0; white-space: pre-wrap; }
#review { margin: 8px 16px; padding: 8px 12px; background: var(--panel); border-radius: 6px; border: 2px solid var(--warn); max-height: 50vh; overflow: auto; flex: none; }
#review h3 { margin: 12px 0 6px; font-size: 14px; }
#review h3:first-child { margin-top: 0; }
#review .meta { color: var(--muted); font-size: 12px; }
#review ul { list-style: none; padding: 0; margin: 4px 0; }
#review .fileli { cursor: pointer; text-decoration: underline; }
#review pre { margin: 4px 0; padding: 4px 0; background: var(--bg); border-radius: 4px; overflow-x: auto; max-height: 360px; font-size: 12px; }
#review pre span { display: block; padding: 0 6px; min-width: max-content; white-space: pre; }
#review pre .l-add { background: var(--diff-add); color: var(--diff-add-mark); }
#review pre .l-del { background: var(--diff-del); color: var(--diff-del-mark); }
#review pre .l-hunk { background: var(--diff-hunk); color: var(--muted); }
#review .cmt { margin: 4px 0; padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--bg); white-space: pre-wrap; }
#review textarea, #review select { display: block; width: 100%; box-sizing: border-box; margin: 4px 0; font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--faint); border-radius: 4px; }
#review textarea { min-height: 56px; }
#review button { margin-right: 8px; }
#review .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <span class="title">graph-execution</span>
  <span class="meta" id="suiteid"></span>
  <span class="meta" id="provider"></span>
  <span class="meta" id="elapsed"></span>
  <span id="progress"></span>
  <span id="conn"></span>
  <span class="spacer"></span>
  <button id="start" type="button" hidden>Start integration</button>
  <button id="action" type="button" hidden></button>
</header>
<div id="err"></div>
<div id="phases"></div>
<div id="summary" hidden></div>
<section id="review" hidden></section>
<div id="main">
  <div id="graph"><div id="zoom"><span class="hint">drag to move · ctrl+scroll to zoom · double-click to fit</span><button id="zout" type="button" aria-label="Zoom out">−</button><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zfit" type="button">fit</button></div></div>
  <aside id="panel" hidden></aside>
</div>
<script>
"use strict";
const SPIN_MS = 900;
const SVGNS = "http://www.w3.org/2000/svg";
const PHASES = ["features", "integration", "e2e", "human", "done"];
const NODE_W = 180, NODE_H = 46, GAP_X = 28, GAP_Y = 44, PAD = 12;
// Feature boxes: the whole graph of each feature run (tasks, then its review loop), with a title bar above.
const BOX_PAD = 14, BOX_HEAD = 34, BOX_GAP = 32;
const ACTIVE = new Set(["running", "validating", "fixing", "merging", "integrating"]);
const COLOR = {
  pending: "--muted", queued: "--muted", waiting: "--muted", running: "--accent", integrating: "--accent", validating: "--validating",
  fixing: "--warn", human: "--warn", merging: "--accent2", merged: "--ok", done: "--ok", applied: "--ok",
  failed: "--bad", aborted: "--bad", stopped: "--warn", excluded: "--faint", skipped: "--faint",
};
const ICON = { pending: "○", queued: "○", waiting: "○", merged: "✔", done: "✔", applied: "✔", failed: "✖", aborted: "✖", stopped: "■", excluded: "⊘", skipped: "⊘", human: "◆" };
const OK = new Set(["merged", "done", "applied"]);
let data = null;
let model = null;
let selected = null; // a node id, or "@feature:<name>" for a feature box
let closed = false;
let failures = 0;
let timer = null;
let lastText = null;

const $ = (id) => document.getElementById(id);
const svgEl = (name, attrs, text) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
};
const div = (cls, text) => {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
};
const span = (cls, text) => Object.assign(document.createElement("span"), { className: cls, textContent: text });
const v = (name) => "var(" + name + ")";
const colorOf = (status) => v(COLOR[status] || "--muted");
const compact = (n) => (n > 999 ? (n / 1000).toFixed(1) + "k" : String(n));
const truncate = (s, max) => (s.length <= max ? s : s.slice(0, Math.max(1, max - 1)) + "…");
function elapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = (n) => String(n).padStart(2, "0");
  return Math.floor(s / 3600) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60);
}
function button(label, onClick, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener("click", onClick);
  return b;
}
async function post(path, errBox) {
  const box = errBox || $("err");
  try {
    const r = await fetch(path, { method: "POST" });
    if (r.ok) box.textContent = "";
    else {
      let msg = "HTTP " + r.status;
      try { msg = (await r.json()).error || msg; } catch (e) { /* keep the status */ }
      box.textContent = msg;
    }
  } catch (e) { box.textContent = "Request failed: disconnected"; }
  refresh();
}

// ---- The graph model: each feature's run graph in a box, a merge per feature, then the e2e loop and the apply ----

const P = (text) => ({ status: "pending", text: text || "pending" });
const F = (text) => ({ status: "failed", text: text || "failed" });
/**
 * The nodes of a review loop (validate → code reviewer + tester → fixer, and the validation fixer once it ran) from
 * its saved progress. `round` is the review round in `review`, the fix pass in `fix`: fix pass n follows review round n-1.
 * A review round shows both agents running until each report is written.
 */
function loopNodes(r, ready, failed, fixers) {
  const nodes = { validate: P(), reviewer: P(), tester: P(), fixer: P(), gateFixer: fixers.gateFixer ? P() : null };
  if (!ready || !r) return nodes;
  const ph = r.phase, n = r.round;
  const fixerDone = fixers.fixer === "done";
  if (ph === "validate") nodes.validate = failed ? F() : { status: "validating", text: r.validationRounds ? "gate round " + (r.validationRounds + 1) : "validating" };
  else if (ph === "fix" && fixerDone) nodes.validate = failed ? F() : { status: "validating", text: "revalidate pass " + n };
  else nodes.validate = { status: "done", text: "passed" };
  if (fixers.gateFixer) nodes.gateFixer = fixers.gateFixer === "running" ? (failed ? F() : { status: "fixing", text: "fixing" }) : { status: "done", text: "done" };
  const reviewed = (report) => {
    if (ph === "validate") return P();
    if (ph === "review") return report ? { status: "done", text: "round " + n } : failed ? F("failed round " + n) : { status: "running", text: "round " + n };
    if ((ph === "done" || ph === "human") && n === 0 && !report) return { status: "skipped", text: "not run" };
    return { status: "done", text: "round " + (ph === "fix" ? n - 1 : n) };
  };
  nodes.reviewer = reviewed(r.reports.code);
  nodes.tester = reviewed(r.reports.tester);
  if (ph === "review") nodes.fixer = n > 0 ? { status: "done", text: "pass " + n } : P();
  else if (ph === "fix") nodes.fixer = failed && !fixerDone ? F("failed pass " + n) : fixerDone ? { status: "done", text: "pass " + n } : { status: "fixing", text: "fixing pass " + n };
  else if (ph === "done" || ph === "human") nodes.fixer = n > 0 ? { status: "done", text: n + (n === 1 ? " pass" : " passes") } : { status: "skipped", text: "not needed" };
  return nodes;
}
function taskText(t) {
  if (t.status === "running" && t.attempts > 1) return "retry " + t.attempts;
  return t.status;
}
function reviewLabel(phase, round) {
  if (phase === "review") return "review round " + round;
  if (phase === "fix") return "fix pass " + round;
  if (phase === "human") return "human review";
  return phase;
}
function mergeNode(s, f, allowed, conflicts, agent) {
  const merged = s.integration.merged;
  if (merged.includes(f.name)) return { status: "merged", text: "merged #" + (merged.indexOf(f.name) + 1), conflicts };
  // A conflicted merge waits on the integration agent's node, which carries the Retry.
  if (agent && agent.status !== "resolved") return { status: agent.status === "failed" ? "failed" : "merging", text: "conflict", conflicts: agent.files };
  if (s.integration.failed === f.name) return { status: "failed", text: "conflict unresolved", retry: allowed.retryIntegration, conflicts };
  if (f.status === "excluded") return { status: "skipped", text: "excluded" };
  if (s.status === "integrating" && f.status === "done" && !s.review) {
    // Merges run one at a time in finish order: the first unmerged done feature is the one merging now.
    const next = s.features.filter((x) => x.status === "done" && !merged.includes(x.name)).sort((a, b) => (a.finishedAt || "").localeCompare(b.finishedAt || ""))[0];
    if (next && next.name === f.name) return { status: "merging", text: "merging" };
  }
  return { status: f.status === "done" ? "waiting" : "pending", text: f.status === "done" ? "waiting" : "pending" };
}
/** The integration agent's node, from its last run on this feature's conflicted merge. */
function agentNode(agent, allowed, running) {
  const n = agent.files.length;
  const files = n + (n === 1 ? " file" : " files");
  if (agent.status === "resolved") return { status: "done", text: "resolved", conflicts: agent.files };
  if (agent.status === "failed") return { status: "failed", text: "gave up after " + agent.attempts, retry: allowed.retryIntegration, conflicts: agent.files };
  if (!running) return { status: "stopped", text: "stopped", conflicts: agent.files };
  return { status: "running", text: agent.attempt > 1 ? "try " + agent.attempt + "/" + agent.attempts : "resolving " + files, conflicts: agent.files };
}
function applyNode(s) {
  if (s.status === "applied") return { status: "applied", text: "applied" };
  if (s.status === "done") return { status: "done", text: "on " + (s.integrationBranch || "suite branch") };
  if (s.status === "failed" || s.status === "aborted") return { status: "skipped", text: s.status };
  return P();
}

function buildModel(d) {
  const s = d.suite;
  const nodes = new Map(); // id -> { title, status, text, feature?, retry?, info? }
  const parents = {};
  const boxes = [];
  const changes = d.changes || {};
  const add = (id, node, from) => {
    nodes.set(id, { ...node, changes: changes[id] });
    parents[id] = from;
  };
  for (const f of d.features) {
    const states = new Map(f.tasks.map((t) => [t.id, t]));
    const taskLayers = f.layers.length ? f.layers.map((l) => [...l]) : (f.tasks.length ? [f.tasks.map((t) => t.id)] : []);
    const ids = taskLayers.flat();
    const canRetry = d.allowed.retry.includes(f.name);
    for (const id of ids) {
      const t = states.get(id) || { status: "pending", attempts: 0 };
      add(f.name + "/" + id, { title: id, status: t.status, text: taskText(t), feature: f.name, retry: t.status === "failed" && canRetry }, (f.parents[id] || []).map((p) => f.name + "/" + p));
    }
    const hasChildren = new Set(Object.values(f.parents).flat());
    const sinks = ids.filter((id) => !hasChildren.has(id)).map((id) => f.name + "/" + id);
    const ready = ids.length > 0 && ids.every((id) => (states.get(id) || {}).status === "merged");
    const loop = loopNodes(f.review, ready, f.status === "failed" || f.status === "stopped", f.fixers || {});
    if (f.status === "done") for (const k of ["validate", "reviewer", "tester"]) if (loop[k].status === "pending") loop[k] = { status: "done", text: "done" };
    const k = (name) => "@" + name + "/" + f.name;
    const withRetry = (n) => ({ ...n, feature: f.name, retry: n.status === "failed" && canRetry });
    add(k("validate"), { title: "validate", ...withRetry(loop.validate) }, sinks);
    const beforeReview = loop.gateFixer ? k("gate-fixer") : k("validate");
    if (loop.gateFixer) add(k("gate-fixer"), { title: "validation fixer", ...withRetry(loop.gateFixer) }, [k("validate")]);
    add(k("reviewer"), { title: "code reviewer", ...withRetry(loop.reviewer) }, [beforeReview]);
    add(k("tester"), { title: "live tester", ...withRetry(loop.tester) }, [beforeReview]);
    add(k("fixer"), { title: "fixer", ...withRetry(loop.fixer) }, [k("reviewer"), k("tester")]);
    boxes.push({ feature: f, layers: [...taskLayers.map((l) => l.map((id) => f.name + "/" + id)), [k("validate")], ...(loop.gateFixer ? [[k("gate-fixer")]] : []), [k("reviewer"), k("tester")], [k("fixer")]] });
    const agent = (s.integration.agents || {})[f.name];
    add("@merge/" + f.name, { title: "merge " + f.name, ...mergeNode(s, f, d.allowed, (d.conflicts || {})["@merge/" + f.name] || [], agent) }, [k("fixer")]);
    if (agent) add("@integration/" + f.name, { title: "integration agent", ...agentNode(agent, d.allowed, d.running) }, ["@merge/" + f.name]);
  }
  // The e2e phase on the suite branch: the same loop, run once every feature is merged.
  const integrated = s.features.every((f) => s.integration.merged.includes(f.name) || f.status === "excluded" || f.status === "failed") && s.integration.merged.length > 0 && !!s.review;
  const suiteFailed = s.status === "failed" || s.status === "aborted";
  const e2e = loopNodes(s.review, integrated, suiteFailed, { fixer: s.review && s.review.phase === "fix" ? "running" : undefined });
  if (s.review && s.review.phase === "human") e2e.fixer = s.review.round > 0 ? { status: "done", text: s.review.round + " passes" } : { status: "human", text: "waiting for you" };
  add("@e2e-validate", { title: "e2e validate", ...e2e.validate }, d.features.map((f) => (nodes.has("@integration/" + f.name) ? "@integration/" : "@merge/") + f.name));
  add("@e2e-reviewer", { title: "cross-feature review", ...e2e.reviewer }, ["@e2e-validate"]);
  add("@e2e-tester", { title: "e2e tester", ...e2e.tester }, ["@e2e-validate"]);
  add("@e2e-fixer", { title: "e2e fixer", ...e2e.fixer }, ["@e2e-reviewer", "@e2e-tester"]);
  add("@apply", { title: s.startBranch && s.merge ? "apply → " + s.startBranch : "result branch", ...applyNode(s) }, ["@e2e-fixer"]);
  return { nodes, parents, boxes };
}

function layout(m) {
  const pos = new Map();
  const boxRects = [];
  let x = PAD;
  let bottom = PAD;
  for (const b of m.boxes) {
    const widest = Math.max(1, ...b.layers.map((l) => l.length));
    const inner = widest * NODE_W + (widest - 1) * GAP_X;
    const w = inner + BOX_PAD * 2;
    const h = BOX_HEAD + b.layers.length * NODE_H + (b.layers.length - 1) * GAP_Y + BOX_PAD;
    b.layers.forEach((layer, row) => {
      const rowW = layer.length * NODE_W + (layer.length - 1) * GAP_X;
      const x0 = x + BOX_PAD + (inner - rowW) / 2;
      layer.forEach((id, i) => pos.set(id, { x: x0 + i * (NODE_W + GAP_X), y: PAD + BOX_HEAD + row * (NODE_H + GAP_Y) }));
    });
    boxRects.push({ feature: b.feature, x, y: PAD, w, h });
    bottom = Math.max(bottom, PAD + h);
    x += w + BOX_GAP;
  }

    const name = key.slice(13);
    const agent = (s.integration.agents || {})[name];
    rows.push("Resolves the conflicts of merging " + name + " into " + (s.integrationBranch || "the suite branch") + ", with the PRDs of the features that changed those files. Same rules as a task merge: no conflict markers left, and a real merge commit.");
    if (agent) {
      rows.push("⚠ Conflicted files: " + agent.files.join(", "));
      rows.push("try " + agent.attempt + " of " + agent.attempts);
      if (agent.status === "failed") actions.push({ text: "The agent gave up after " + agent.attempts + " tries. The merge is left conflicted in the suite's integration worktree.", button: d.allowed.retryIntegration ? ["Retry integration", "/api/integration/retry"] : null });
    }
  } else if (key === "@apply") {
    rows.push(s.applied ? s.applied.files + " files applied, " + s.applied.conflicts.length + " conflicts left" : "Applies the combined result once, as uncommitted changes.");
  } else {
    const r = s.review;
    rows.push({ "@e2e-validate": "Validation on the combined result of all features.", "@e2e-reviewer": "Reviews the files several features changed, with every PRD.", "@e2e-tester": "Runs every feature's test plan on the combined result.", "@e2e-fixer": "Fixes the e2e findings on the suite branch." }[key] || "");
    if (r) rows.push("phase " + reviewLabel(r.phase, r.round));
  }
  return { rows, actions };
}
function renderPanel(d) {
  const panel = $("panel");
  const main = $("main");
  const key = selected;
  const featureName = featureOf(key);
  const node = key && model.nodes.get(key);
  const f = featureName && d.features.find((x) => x.name === featureName);
  if (!key || (!node && !f)) {
    if (!panel.hidden) { selected = null; pnl.key = null; pnl.logs = null; panel.hidden = true; main.classList.remove("withpanel"); requestAnimationFrame(applyView); }
    return;
  }
  if (pnl.key !== key) {
    pnl.key = key;
    pnl.rows = new Map();
    pnl.expanded = new Set();
    pnl.diffs = new Map();
    pnl.logsOpen = new Set();
    pnl.sig = {};
    pnl.logs = logSource(key) ? div("sec logs", "Loading logs…") : null;
    const files = document.createElement("ul");
    files.className = "files";
    panel.replaceChildren(div("phead"), div("info"), div("actions"), div("totals"), div("none"), files, ...(pnl.logs ? [pnl.logs] : []));
    panel.scrollTop = 0;
  }
  const [head, info, actions, totals, none, list] = panel.children;
  const title = node ? (f ? f.name + " / " : "") + node.title : f.name;
  const status = node ? { status: node.status, text: node.text } : { status: f.status, text: f.status };
  setSection(head, "head", title + "|" + status.status + "|" + status.text, () => {
    const st = div("", status.text);
    st.style.color = colorOf(status.status);
    return [div("ftitle", title), st, button("×", () => { selected = null; render(data); }, "close")];
  });
  const { rows, actions: acts } = infoOf(d, key, node, f);
  setSection(info, "info", JSON.stringify(rows) + JSON.stringify(f && !node ? f.tasks : null), () => {
    const kids = rows.filter(Boolean).map((r) => div(r.startsWith("⚠") ? "row warn" : "row", r));
    if (f && !node) {
      const ul = document.createElement("ul");
      ul.className = "tasks";
      for (const t of f.tasks) {
        const li = document.createElement("li");
        const icon = span("", (ICON[t.status] || "●") + " ");
        icon.style.color = colorOf(t.status);
        li.append(icon, t.id + " " + taskText(t) + (t.attempts > 1 ? " (" + t.attempts + " attempts)" : ""));
        ul.append(li);
      }
      kids.push(ul);
    }
    return kids;
  });
  setSection(actions, "actions", JSON.stringify(acts), () => acts.flatMap((a) => {
    const err = div("err");
    const box = div("sec", a.text);
    if (a.button) box.append(document.createElement("br"), button(a.button[0], () => post(a.button[1], err)), err);
    return [box];
  }));
  // Changes: a feature box shows nothing of its own; click a task or an agent for its diff.
  const ch = node && node.changes;
  const files = (ch && ch.files) || [];
  totals.hidden = files.length === 0;
  none.hidden = files.length > 0 || !node;
  none.textContent = "No changes";
  if (files.length) {
    totals.replaceChildren(document.createTextNode(ch.total.files + (ch.total.files === 1 ? " file " : " files ")), span("add", "+" + ch.total.added), document.createTextNode(" "), span("del", "−" + ch.total.deleted));
  }
  const conflicted = new Set((node && node.conflicts) || []);
  const seen = new Set();
  files.forEach((fl, i) => {
    seen.add(fl.path);
    let row = pnl.rows.get(fl.path);
    if (!row) { row = makeRow(key, fl); pnl.rows.set(fl.path, row); }
    updateRow(key, row, fl, conflicted.has(fl.path));
    if (list.children[i] !== row.li) list.insertBefore(row.li, list.children[i] || null);
  });
  for (const [path, row] of pnl.rows) {
    if (seen.has(path)) continue;
    row.li.remove();
    pnl.rows.delete(path);
    pnl.expanded.delete(path);
    pnl.diffs.delete(path);
  }
  if (pnl.logs) loadLogs(logSource(key), pnl.logs);
  if (panel.hidden) { panel.hidden = false; main.classList.add("withpanel"); requestAnimationFrame(applyView); }
}

// ---- Human review before the single apply: built once per wait, so the refresh does not wipe what is typed ----

let reviewShown = false;
let rv = null;
const reviewErr = div("err");

async function reviewCall(method, path, body) {
  try {
    const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (r.status === 200 || r.status === 201) { reviewErr.textContent = ""; return true; }
    let msg = "HTTP " + r.status;
    try { msg = (await r.json()).error || msg; } catch (e) { /* keep the status */ }
    reviewErr.textContent = msg;
  } catch (e) { reviewErr.textContent = String(e); }
  return false;
}
async function showDiff(file, pre) {
  const r = await fetch("/api/review/diff?file=" + encodeURIComponent(file) + "&round=" + rv.round);
  const d = await r.json();
  pre.replaceChildren();
  if (r.status !== 200) return void (pre.textContent = d.error || "HTTP " + r.status);
  if (d.binary) return void (pre.textContent = "binary file");
  for (const line of d.diff.split("\n")) {
    const cls = line.startsWith("@@") ? "l-hunk" : line.startsWith("+") && !line.startsWith("+++") ? "l-add" : line.startsWith("-") && !line.startsWith("---") ? "l-del" : "";
    pre.append(span(cls, line || " "));
  }
  if (d.truncated) pre.append(document.createTextNode("(truncated)"));
}
async function buildReview() {
  const panel = $("review");
  const r = await fetch("/api/review");
  if (r.status !== 200) return;
  rv = await r.json();
  const blocking = rv.blocking || [];
  const h = (t) => Object.assign(document.createElement("h3"), { textContent: t });
  const kids = [h("Waiting for your review — round " + rv.round)];
  kids.push(div("meta", rv.diffBase ? "diff " + rv.diffBase.slice(0, 8) + ".." + rv.diffHead.slice(0, 8) : "no diff available"));
  const files = document.createElement("ul");
  const pre = document.createElement("pre");
  pre.textContent = "Click a file to see its diff.";
  for (const f of rv.files || []) {
    const li = document.createElement("li");
    const name = span("fileli", f.path);
    name.onclick = () => showDiff(f.path, pre);
    li.append(name, " ", span("add", "+" + f.added), " ", span("del", "−" + f.deleted));
    files.append(li);
  }
  kids.push(files, pre, h("Open findings (" + blocking.length + ")"));
  const fl = document.createElement("ul");
  for (const f of blocking) fl.append(Object.assign(document.createElement("li"), { textContent: "[" + f.severity + "] " + (f.file ? f.file + ": " : "") + f.description }));
  kids.push(fl, h("Comments"));
  for (const c of rv.comments || []) {
    const box = div("cmt", c.id + (c.file ? " " + c.file + (c.line ? ":" + c.line : "") : " (general)") + " [" + c.status + "]" + (c.liveCheck ? " needs live check" : "") + "\n" + c.body);
    const o = (rv.outcomes || {})[c.id];
    if (o) box.append(div("meta", "outcome: " + [o.verdict, o.fixerNote, o.liveCheck && "live: " + o.liveCheck.verdict].filter(Boolean).join(" · ")));
    const act = async (action) => { if (await reviewCall("POST", "/api/review/comments/" + encodeURIComponent(c.id) + "/" + action, {})) buildReview(); };
    box.append(document.createElement("br"), c.status !== "resolved" ? button("Resolve", () => act("resolve")) : button("Reopen", () => act("reopen")));
    kids.push(box);
  }
  const body = document.createElement("textarea");
  body.placeholder = "Comment";
  const sel = document.createElement("select");
  sel.append(Object.assign(document.createElement("option"), { value: "", textContent: "general" }));
  for (const f of rv.files || []) sel.append(Object.assign(document.createElement("option"), { value: f.path, textContent: f.path }));
  const live = Object.assign(document.createElement("input"), { type: "checkbox" });
  const lbl = document.createElement("label");
  lbl.append(live, " needs live check");
  const add = button("Add comment", async () => {
    const payload = { body: body.value, liveCheck: live.checked };
    if (sel.value) payload.file = sel.value;
    if (await reviewCall("POST", "/api/review/comments", payload)) buildReview();
  });
  kids.push(body, sel, lbl, document.createElement("br"), add);
  const bar = div("");
  bar.style.marginTop = "8px";
  bar.append(
    button("Apply", async () => {
      const hasOpen = blocking.length > 0;
      if (hasOpen && !confirm("There are open findings. Apply anyway?")) return;
      await reviewCall("POST", "/api/review/apply", hasOpen ? { force: true } : {});
      refresh();
    }),
    button("Request changes", async () => { await reviewCall("POST", "/api/review/changes", {}); refresh(); }),
    button("Drop", async () => {
      if (confirm("Drop the result? Nothing is applied; it stays on the suite branch.")) await reviewCall("POST", "/api/review/drop", {});
      refresh();
    }),
  );
  kids.push(bar, reviewErr);
  panel.replaceChildren(...kids);
}
function updateReview(waiting) {
  $("review").hidden = !waiting;
  if (waiting && !reviewShown) buildReview();
  reviewShown = waiting;
}

// ---- Wiring ----

function render(d) {
  const endedAt = data && data.endedAt;
  data = d;
  if (endedAt) data.endedAt = endedAt;
  updateReview(d.reviewWaiting === true);
  renderHeader(d);
  renderSummary(d);
  renderGraph(d);
  renderPanel(d);
  tickElapsed();
}
async function refresh() {
  if (closed) return;
  try {
    const r = await fetch("/api/suite");
    if (r.status !== 200) throw new Error(String(r.status));
    failures = 0;
    $("conn").textContent = "";
    // Re-render only on change, like the run page's state events: a rebuild between mousedown and mouseup loses the click.
    const text = await r.text();
    if (text !== lastText) {
      lastText = text;
      render(JSON.parse(text));
    } else if (pnl.logs) {
      loadLogs(logSource(pnl.key), pnl.logs);
    }
  } catch (e) {
    if (++failures >= 2) $("conn").textContent = "Disconnected";
  }
}
async function onAction() {
  if (!data) return;
  if (data.running) {
    if (!confirm("Abort the suite? Running feature runs are stopped; it can be resumed.")) return;
    return post("/api/abort");
  }
  try {
    const r = await fetch("/close", { method: "POST" });
    if (!r.ok) return;
  } catch (e) { return; }
  closed = true;
  clearInterval(timer);
  document.body.replaceChildren(Object.assign(document.createElement("p"), { textContent: "Server closed.", style: "padding: 16px" }));
}

$("action").addEventListener("click", onAction);
$("start").addEventListener("click", () => {
  if (confirm("Start the integration without the failed features?")) post("/api/integration/start");
});
setupCanvas();
refresh();
timer = setInterval(() => { refresh(); tickElapsed(); }, 1000);
</script>
</body>

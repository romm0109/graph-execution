<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph-execution suite</title>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/graph.css">
<link rel="stylesheet" href="/assets/diff.css">
<link rel="stylesheet" href="/assets/diffview.css">
<link rel="stylesheet" href="/assets/shell.css">
<link rel="stylesheet" href="/assets/panel.css">
<link rel="stylesheet" href="/assets/review.css">
<link rel="stylesheet" href="/assets/comments.css">
<link rel="stylesheet" href="/assets/logs.css">
<link rel="stylesheet" href="/assets/suitepage.css">
</head>
<body>
<header id="topbar">
  <span class="title">graph-execution suite</span>
  <span class="meta mono" id="suiteid"></span>
  <span class="meta" id="provider"></span>
  <span class="meta mono" id="elapsed"></span>
  <span class="prog"><span id="progress"></span><span class="pbar"><i id="pfill"></i></span></span>
  <span id="conn"></span>
  <span class="spacer"></span>
  <button id="summarybtn" type="button" hidden>Summary</button>
  <button id="start" type="button" hidden>Start integration</button>
  <button id="action" type="button" hidden></button>
</header>
<div id="main">
  <div id="graph"></div>
  <div id="phases"></div>
  <div id="summarycard" hidden></div>
</div>
<div id="drawer" class="toast"><div class="drawer-strip"><span class="drawer-line" id="err"></span></div></div>
<script type="module" src="/assets/suitepage.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>graph-manager</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1d1d1f; --muted: #5f6368; --panel: #ffffff; --border: #d9d9de; --accent: #2563eb; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1e; --fg: #ececf1; --muted: #a0a0a8; --panel: #26262b; --border: #3a3a41; --accent: #3b82f6; --accent-fg: #ffffff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 24px; }
  main { width: 100%; max-width: 760px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0 0 16px; max-height: 50vh;
    overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  pre:empty { display: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); cursor: pointer; }
  button:first-child { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <pre id="detail"></pre>
  <div class="actions" id="actions"></div>
</main>
<script>
  const LABELS = {
    retry: "Retry",
    restart: "Restart server",
    log: "Open log",
    change: "Change server",
    connect: "Connect to it",
    local: "Run on this computer",
  };
  const q = new URLSearchParams(location.search);
  const title = q.get("title") || "Something went wrong";
  document.getElementById("title").textContent = title;
  document.title = title;
  document.getElementById("detail").textContent = q.get("detail") || "";
  const box = document.getElementById("actions");
  for (const name of (q.get("actions") || "").split(",").map((s) => s.trim())) {
    if (!Object.prototype.hasOwnProperty.call(LABELS, name)) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = LABELS[name];
    b.addEventListener("click", async () => {
      // "log" leaves the page as it is; the others replace it.
      if (name !== "log") for (const other of box.querySelectorAll("button")) other.disabled = true;
      try {
        await window.gmDesktop.action(name);
      } finally {
        if (name !== "log") for (const other of box.querySelectorAll("button")) other.disabled = false;
      }
    });
    box.appendChild(b);
  }
</script>
</body>
</html>

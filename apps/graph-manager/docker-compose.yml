# Run from apps/graph-manager:  GM_PASSWORD=... docker compose up --build
services:
  graph-manager:
    build:
      context: ../..
      dockerfile: apps/graph-manager/Dockerfile
    image: graph-manager:dev
    ports:
      - "7420:7420"
    environment:
      GM_PASSWORD: ${GM_PASSWORD:?set GM_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-graph-manager}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-graph-manager@localhost}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-graph-manager}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-graph-manager@localhost}
    # Sandboxed runs (KAN-88): graph-manager starts run containers through the host's Docker socket. DOCKER_GID: the socket's group id (stat -c %g /var/run/docker.sock).
    # The socket gives graph-manager root-equivalent access to the host; remove these two lines to turn sandboxes off.
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gm-data:/data
      - gm-workspaces:/workspaces
      # The tools (engine, provider CLIs) graph-manager fills at startup; every sandbox mounts them read-only.
      - gm-tools:/opt/gm-tools
    restart: unless-stopped

volumes:
  gm-data:
  gm-workspaces:
  gm-tools:

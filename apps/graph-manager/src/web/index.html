<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>graph-manager</title>
    <script>
      // Sets the theme before first paint (no flash); ui/theme.ts takes over once the app loads.
      (function () {
        // Dark unless the user picked Light, or System on a light OS.
        var theme = "dark";
        try {
          var pref = window.localStorage.getItem("gm.theme");
          if (pref === "light") theme = "light";
          else if (pref === "system" && window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
